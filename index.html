<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intel: Sustainability Through the Ages</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <img class="intel-logo" src="img/intel-header-logo.svg" alt="Intel Logo" />
      <h1>Sustainability Through the Ages</h1>
      <p>
        Explore Intel's journey through time, discovering how our commitment
        to innovation has shaped a more sustainable future for technology
        and our planet.
      </p>
    </div>
  </header>

  <main class="page-content">
    <div class="timeline-layout">
      <aside class="year-sidebar" aria-label="Year list">
        <div class="year-sidebar-label">Years</div>
        <div id="yearList" class="year-list"></div>
      </aside>

      <div class="timeline-content">

        <section class="cube-scene" aria-label="Timeline cube">
          <div id="timelineCube" class="cube">
            <div class="cube-face cube-front"></div>
            <div class="cube-face cube-right"></div>
            <div class="cube-face cube-back"></div>
            <div class="cube-face cube-left"></div>
            <div class="cube-face cube-top"></div>
            <div class="cube-face cube-bottom"></div>
          </div>
        </section>
      </div>
    </div>

    <div class="year-slider" aria-label="Timeline year slider" hidden>
      <div id="yearTrack" class="year-track"></div>
      <div id="sliderDot" class="slider-dot" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    // Timeline data for the years and descriptions.
    const timelineData = [
      {
        year: '1968',
        title: 'Intel Founded',
        text: 'Robert Noyce and Gordon Moore rename the newly formed company NM Electronics to Intel Corporation, laying the foundation for decades of technological innovation.',
        image: '1.jpg'
      },
      {
        year: '1971',
        title: 'First Microprocessor',
        text: 'Intel debuts the 4004, the world\'s first commercial microprocessor, igniting the microprocessor revolution and propelling the future of computing devices.',
        image: '2.jpg'
      },
      {
        year: '1978',
        title: '8086 Processor',
        text: 'Launch of the 8086 processor, establishing the x86 architecture that drives countless PCs and servers in the modern era.',
        image: '3.jpg'
      },
      {
        year: '1985',
        title: '386 Processor',
        text: 'Intel introduces the 386 processor with 32-bit architecture, ushering in a new era of performance and multitasking for personal computers.',
        image: '4.jpg'
      },
      {
        year: '2006',
        title: 'Peak GHG Emissions',
        text: 'This year marks Intel\'s highest annual greenhouse gas emissions for operations. Over subsequent years, Intel invests heavily in chemical abatement, renewable energy, and energy-efficient manufacturing to reverse this trend.',
        image: '2006.jpg'
      },
      {
        year: '2020',
        title: 'RISE Strategy',
        text: 'Intel launches its RISE (Responsible, Inclusive, Sustainable, Enabling) strategy and 2030 goals, aiming to drive industry-wide progress on climate action, water stewardship, and waste reduction.',
        image: '2020.jpg'
      },
      {
        year: '2022',
        title: 'Net-Zero By 2040',
        text: 'Intel announces its commitment to achieve net-zero greenhouse gas emissions (Scope 1 and 2) across its global operations by 2040, building on years of environmental initiatives.',
        image: '2022.jpg'
      },
      {
        year: '2023',
        title: 'Renewable Electricity',
        text: 'The company achieves 99% renewable electricity usage worldwide, helping to drastically lower carbon emissions and driving progress toward Intel\'s long-term sustainability goals.',
        image: '2023.jpg'
      },
      {
        year: '2024',
        title: 'Sustainability Summit',
        text: 'Intel hosts its first Sustainability Summit, uniting suppliers, government officials, and industry leaders to collaborate on next-generation sustainable semiconductor manufacturing.',
        image: '2024.jpg'
      }
    ];

    // Grab the main pieces from the HTML.
    const yearList = document.getElementById('yearList');
    const cube = document.getElementById('timelineCube');
    const cubeFaces = {
      front: document.querySelector('.cube-front'),
      right: document.querySelector('.cube-right'),
      back: document.querySelector('.cube-back'),
      left: document.querySelector('.cube-left'),
      top: document.querySelector('.cube-top'),
      bottom: document.querySelector('.cube-bottom')
    };

    let selectedIndex = 0;
    let isDragging = false;
    let wheelAccumulator = 0;
    const wheelThreshold = 60;

    const cubeFaceOrder = [
      { name: 'front', x: 0, y: 0 },
      { name: 'right', x: 0, y: -90 },
      { name: 'back', x: 0, y: -180 },
      { name: 'left', x: 0, y: 90 },
      { name: 'top', x: -90, y: 0 },
      { name: 'bottom', x: 90, y: 0 }
    ];

    const imageFallbacks = {
      '1.jpg': '1.jpg',
      '2.jpg': '2.jpg',
      '3.jpg': '3.jpg',
      '4.jpg': '4.jpg',
      '2006.jpg': '2006.jpg',
      '2020.jpg': '2006.jpg',
      '2022.jpg': '2024.jpg',
      '2023.jpg': '2024.jpg',
      '2024.jpg': '2024.jpg'
    };

    function getImageForItem(item) {
      return imageFallbacks[item.image] || '1.jpg';
    }

    function clearCubeFaces() {
      Object.values(cubeFaces).forEach((face) => {
        face.classList.remove('active');
        face.innerHTML = '<div class="blank-face"></div>';
      });
    }

    function setActiveFace(selectedFaceName, item) {
      clearCubeFaces();

      const imageName = getImageForItem(item);
      const activeFace = cubeFaces[selectedFaceName];
      activeFace.classList.add('active');
      activeFace.style.backgroundImage = `linear-gradient(rgba(5, 25, 42, 0.35), rgba(5, 25, 42, 0.35)), url('img/${imageName}')`;
      activeFace.style.backgroundSize = 'cover';
      activeFace.style.backgroundPosition = 'center';
      activeFace.innerHTML = `
        <div class="cube-card">
          <span class="cube-year">${item.year}</span>
          <h3>${item.title}</h3>
          <p>${item.text}</p>
        </div>
      `;
    }

    function rotateCubeToYear(index) {
      const face = cubeFaceOrder[index % cubeFaceOrder.length];
      cube.style.transform = `rotateX(${face.x}deg) rotateY(${face.y}deg)`;
    }

    function updateYearList() {
      const items = [...yearList.children];
      items.forEach((item, index) => {
        item.classList.toggle('active', index === selectedIndex);
        item.setAttribute('tabindex', '0');
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `Select year ${timelineData[index].year}`);
      });

      const activeItem = yearList.children[selectedIndex];
      if (activeItem) {
        const listTop = yearList.scrollTop;
        const activeTop = activeItem.offsetTop;
        const activeHeight = activeItem.offsetHeight;
        const middle = listTop + (yearList.clientHeight / 2) - (activeHeight / 2);

        if (Math.abs(activeTop - middle) > 2) {
          yearList.scrollTo({
            top: activeTop - (yearList.clientHeight / 2) + (activeHeight / 2),
            behavior: 'smooth'
          });
        }
      }
    }

    function selectYear(index) {
      selectedIndex = Math.max(0, Math.min(index, timelineData.length - 1));

      const item = timelineData[selectedIndex];
      const face = cubeFaceOrder[selectedIndex % cubeFaceOrder.length];
      const faceName = face.name;

      setActiveFace(faceName, item);
      rotateCubeToYear(selectedIndex);
      updateYearList();
    }

    let touchStartY = 0;

    function handleWheelRotation(event) {
      event.preventDefault();

      wheelAccumulator += event.deltaY;

      if (Math.abs(wheelAccumulator) < wheelThreshold) {
        return;
      }

      const direction = wheelAccumulator > 0 ? 1 : -1;
      wheelAccumulator = 0;
      selectYear(selectedIndex + direction);
    }

    function handleTouchStart(event) {
      touchStartY = event.touches[0].clientY;
    }

    function handleTouchMove(event) {
      const currentY = event.touches[0].clientY;
      const distance = currentY - touchStartY;

      if (Math.abs(distance) < 60) return;

      const direction = distance > 0 ? -1 : 1;
      touchStartY = currentY;
      selectYear(selectedIndex + direction);
    }

    function handleKeyboardInput(event) {
      if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(event.key)) {
        event.preventDefault();
        selectYear(selectedIndex + 1);
      }

      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        selectYear(selectedIndex - 1);
      }
    }

    window.addEventListener('wheel', handleWheelRotation, { passive: false });
    window.addEventListener('touchstart', handleTouchStart, { passive: true });
    window.addEventListener('touchmove', handleTouchMove, { passive: true });
    window.addEventListener('keydown', handleKeyboardInput);

    timelineData.forEach((item, index) => {
      const listItem = document.createElement('div');
      listItem.className = 'year-list-item';
      listItem.textContent = item.year;
      listItem.classList.toggle('active', index === selectedIndex);
      listItem.addEventListener('click', () => selectYear(index));
      listItem.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectYear(index);
        }
      });
      yearList.appendChild(listItem);
    });

    clearCubeFaces();
    selectYear(0);
  </script>
</body>
</html>
